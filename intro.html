<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heard, and why it exists</title>
<link rel="icon" href="heard-icon.png">
<style>
  :root {
    --blue:#1f4e79; --blue-lt:#eaf1f8; --accent:#2e75b6;
    --red:#b3261e; --green:#1e7d46; --green-lt:#e8f5ee;
    --ink:#1a1d21; --mut:#5f6b76; --bg:#f4f6f8; --card:#fff; --line:#dde3e9;
    --teal:#12807c; --teal-deep:#0b5f5c; --coral:#e8735a; --cream:#fdf8f3;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--teal-deep); color:var(--ink); overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }

  #film { position:fixed; inset:0; }
  .scene { position:absolute; inset:0; opacity:0; transition:opacity 1.1s ease; overflow:hidden; }
  .scene.on { opacity:1; }

  /* ---- text scenes ---- */
  .scene.dark { background:linear-gradient(160deg, var(--teal) 0%, var(--teal-deep) 70%); color:var(--cream); }
  .scene.cream { background:var(--cream); color:var(--teal-deep); }
  .stage { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; text-align:center; padding:28px 6vw; gap:26px; }
  .big { font-size:clamp(27px, 4.6vw, 44px); font-weight:800; line-height:1.22; max-width:820px;
    opacity:0; transform:translateY(14px); transition:opacity .9s ease, transform .9s ease; }
  .med { font-size:clamp(20px, 3.1vw, 30px); font-weight:600; line-height:1.4; max-width:780px;
    opacity:0; transform:translateY(14px); transition:opacity .9s ease, transform .9s ease; }
  .dark .med { color:#eef7f4; }
  .cream .med { color:#155a50; }
  .big.on, .med.on { opacity:1; transform:none; }
  .dim { opacity:.55 !important; }

  /* ---- the app as a backdrop or a subject ---- */
  .phonewrap { position:absolute; left:50%; top:24px; transform-origin:top center; }
  .phone { width:344px; height:724px; border-radius:42px; background:#10161c; padding:12px 11px 15px;
    box-shadow:0 18px 44px rgba(16,22,28,.4); position:relative; }
  .notch { position:absolute; top:12px; left:50%; transform:translateX(-50%); width:112px; height:22px;
    background:#10161c; border-radius:0 0 15px 15px; z-index:9; }
  .screen { position:relative; width:100%; height:100%; background:var(--bg); border-radius:32px;
    overflow:hidden; padding:34px 13px 8px; }
  .backdrop { position:absolute; inset:0; display:flex; justify-content:center;
    filter:blur(3px) saturate(.85); opacity:.30; pointer-events:none; }
  .veil { position:absolute; inset:0; background:linear-gradient(180deg, rgba(253,248,243,.86), rgba(253,248,243,.94)); }

  /* app chrome, matched to the live app */
  .c { background:var(--card); border-radius:14px; padding:11px 12px; margin-bottom:9px; }
  .sec { font-size:10px; text-transform:uppercase; letter-spacing:.7px; color:var(--mut); margin:0 0 8px; }
  .note { font-size:11.5px; color:var(--mut); line-height:1.42; }
  .privacy { display:flex; align-items:center; gap:7px; font-size:11px; color:var(--mut);
    justify-content:center; margin-bottom:8px; }
  .dot { width:10px; height:10px; flex:0 0 10px; border-radius:50%; background:#b7bfc7; }
  .dot.live { background:var(--red); animation:pulse 1.2s infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.35; } }
  .mic { width:116px; height:116px; border-radius:50%; margin:6px auto; display:flex; flex-direction:column;
    align-items:center; justify-content:center; color:#fff; font-size:13px; font-weight:700;
    background:radial-gradient(circle at 35% 30%,#3d86c8,var(--blue));
    box-shadow:0 6px 18px rgba(31,78,121,.35); transition:background .45s ease, transform .35s ease; }
  .mic em { font-style:normal; font-size:24px; margin-bottom:3px; }
  .mic.rec { background:radial-gradient(circle at 35% 30%,#e05a52,var(--red)); transform:scale(1.04);
    box-shadow:0 0 0 10px rgba(179,38,30,.14); }
  .livebox { background:var(--blue-lt); border-radius:10px; padding:9px 11px; font-size:13px;
    min-height:38px; margin-top:9px; }
  .typebox { display:flex; gap:7px; margin-top:8px; }
  .typebox .f { flex:1; height:38px; border:1px solid var(--line); border-radius:10px; background:#fff;
    display:flex; align-items:center; padding:0 10px; font-size:12.5px; color:#9aa4ad; }
  .typebox .a { width:52px; height:38px; border-radius:10px; background:var(--accent); color:#fff;
    font-size:12.5px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .entry { border-left:3px solid var(--accent); background:#fafcfe; padding:8px 10px;
    border-radius:0 10px 10px 0; margin-top:7px; font-size:12.5px; line-height:1.35; }
  .entry .t { display:block; font-size:9.5px; color:var(--mut); margin-bottom:2px; }
  .foot { display:flex; justify-content:space-between; align-items:center; margin-top:6px;
    font-size:10.5px; gap:7px; }
  .foot .l { color:var(--green); font-weight:700; }
  .foot .r { color:var(--mut); }

  /* the green ring that lands on what is being talked about */
  .ring { position:absolute; border:7px solid var(--green); border-radius:18px; pointer-events:none;
    box-shadow:0 0 0 6px rgba(30,125,70,.25); opacity:0; transition:opacity .5s ease,
    left .6s ease, top .6s ease, width .6s ease, height .6s ease; z-index:30; }
  .ring.on { opacity:1; animation:breathe 1.7s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { box-shadow:0 0 0 6px rgba(30,125,70,.25); }
    50% { box-shadow:0 0 0 13px rgba(30,125,70,.12); } }

  /* narration for the app scene: the same green-framed note as the walkthrough, page sized */
  .say { position:absolute; left:50%; bottom:74px; transform:translateX(-50%); width:min(680px, 92vw);
    background:#fff; border:12px solid var(--green); border-radius:24px; padding:16px 20px;
    text-align:center; z-index:40; font-size:clamp(18px, 2.5vw, 24px); font-weight:700;
    line-height:1.35; color:var(--ink);
    box-shadow:0 0 0 4px rgba(30,125,70,.28), 0 16px 36px rgba(16,22,28,.35);
    opacity:0; transition:opacity .55s ease; }
  .say.on { opacity:1; }
  .say.pop { animation:pop .4s cubic-bezier(.2,.9,.3,1.25); }
  @keyframes pop { 0% { transform:translateX(-50%) scale(.94); } 100% { transform:translateX(-50%) scale(1); } }

  /* closing card */
  .endmark { width:84px; height:84px; border-radius:22px; box-shadow:0 6px 18px rgba(11,95,92,.25);
    opacity:0; transform:translateY(14px); transition:opacity .9s ease, transform .9s ease; }
  .endmark.on { opacity:1; transform:none; }
  .btnrow { display:flex; gap:12px; flex-wrap:wrap; justify-content:center;
    opacity:0; transition:opacity .9s ease; }
  .btnrow.on { opacity:1; }
  .fbtn { display:inline-flex; align-items:center; justify-content:center; min-height:54px;
    padding:0 24px; border-radius:14px; font-size:16.5px; font-weight:700; cursor:pointer;
    text-decoration:none; border:0; font-family:inherit; }
  .fbtn.pri { background:var(--teal); color:#fff; }
  .fbtn.sub { background:#fff; color:var(--teal-deep); border:2px solid #cfe0df; }

  /* chrome: progress and controls */
  #prog { position:fixed; left:0; top:0; height:5px; width:0; background:var(--coral);
    z-index:60; transition:width .8s ease; }
  #ctrl { position:fixed; left:50%; bottom:14px; transform:translateX(-50%); display:flex; gap:9px;
    z-index:60; }
  #ctrl button { border:0; border-radius:999px; padding:10px 18px; font-size:14px; font-weight:700;
    font-family:inherit; cursor:pointer; background:rgba(16,22,28,.55); color:#fff; }
  #ctrl button:hover { background:rgba(16,22,28,.75); }
  #home { position:fixed; right:14px; top:12px; z-index:60; font-size:13.5px; font-weight:600;
    color:rgba(255,255,255,.9); background:rgba(16,22,28,.45); padding:8px 14px;
    border-radius:999px; text-decoration:none; }
  .cream ~ #home { color:#fff; }
  #hint { position:fixed; left:50%; bottom:58px; transform:translateX(-50%); z-index:60;
    font-size:12.5px; color:rgba(255,255,255,.85); text-shadow:0 1px 4px rgba(0,0,0,.3);
    transition:opacity 1s ease; }

  @media (max-height:700px){ .say { bottom:64px; } }
  @media (prefers-reduced-motion: reduce) {
    .scene, .big, .med, .say, .ring, .btnrow, .endmark, #prog { transition-duration:.01ms !important; }
    .ring.on, .dot.live, .say.pop { animation:none !important; }
  }
</style>
</head>
<body>
<div id="film"></div>
<div id="prog"></div>
<a id="home" href="./">Back to Heard</a>
<div id="hint">Tap anywhere to move ahead</div>
<div id="ctrl">
  <button id="pause">Pause</button>
  <button id="restart">&#8635; Restart</button>
</div>

<script>
const film = document.getElementById("film");
const RM = matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
let token = 0, idx = 0, paused = false, auto = true, timer = null;

function guard(my){ if (my !== token) throw "x"; }
/* Chunked sleep: honors Pause, dies when the film moves on, and shortens for
   reduced motion. Chunks also mean a hidden tab resumes cleanly. */
async function sleep(ms, my){
  let left = RM ? Math.min(ms, 120) : ms;
  while (left > 0){
    await new Promise(r => setTimeout(r, 110));
    guard(my);
    if (!paused) left -= 110;
  }
}
/* Reading pace sized for an older audience: near subtitle speed with a beat on
   each line. Tap anywhere to move ahead sooner; Pause to linger. */
function readTime(text){ return 1150 + text.trim().split(/\s+/).length * 390; }

function on(el){ void el.offsetWidth; el.classList.add("on"); return el; }
function newScene(cls){
  const old = film.querySelector(".scene.on");
  if (old) { old.classList.remove("on"); setTimeout(() => old.remove(), 1300); }
  const d = document.createElement("div");
  d.className = "scene " + cls;
  film.appendChild(d);
  void d.offsetWidth; d.classList.add("on");
  return d;
}
async function line(parent, cls, text, my){
  const el = document.createElement("div");
  el.className = cls; el.textContent = text;
  parent.appendChild(el); on(el);
  await sleep(readTime(text), my);
  return el;
}

/* ---- app fragments, matched to the live app ---- */
const patientHead = () =>
  '<div class="c"><div class="sec">Hello, Margaret</div>' +
  '<div class="privacy"><span class="dot" id="dot"></span><span id="plabel">Microphone off &mdash; nothing is being recorded</span></div>' +
  '<div class="mic" id="mic"><em>&#127908;</em><span id="miclabel">Tap to speak</span></div>' +
  '<div class="note" style="text-align:center;margin-top:7px">Tap, say your question or concern, tap again to stop. Your care team will see it at their next visit.</div>' +
  '<div class="livebox" id="live">&nbsp;</div>' +
  '<div class="typebox"><div class="f">Or type a question / concern&hellip;</div><div class="a">Add</div></div></div>';
const entry = (text, when) =>
  '<div class="entry"><span class="t">' + when + '</span>' + text +
  '<div class="foot"><span class="l">&#9744; I was heard</span><span class="r">Waiting for your care team</span></div></div>';
const listCard = (n, inner) =>
  '<div class="c" id="listcard"><div class="sec">Captured so far (' + n + ')</div>' +
  (inner || '<div class="note">Nothing captured yet.</div>') + '</div>';

function phoneWrap(inner){
  return '<div class="phonewrap"><div class="phone"><div class="notch"></div>' +
         '<div class="screen">' + inner + '</div></div></div>';
}
function fitPhone(scene){
  const w = scene.querySelector(".phonewrap");
  if (!w) return;
  const room = innerHeight - 24 - 150;             /* header air and the narration note */
  const s = Math.min(1, Math.max(.5, room / 724));
  w.style.transform = "translateX(-50%) scale(" + s + ")";
}
addEventListener("resize", () => { const sc = film.querySelector(".scene.on"); if (sc) fitPhone(sc); });

function say(scene, text){
  let el = scene.querySelector(".say");
  if (!el){ el = document.createElement("div"); el.className = "say"; scene.appendChild(el); }
  el.textContent = text;
  el.classList.remove("pop"); void el.offsetWidth;
  el.classList.add("on", "pop");
  return el;
}
function ringTo(scene, sel, pad){
  let ring = scene.querySelector(".ring");
  if (!ring){ ring = document.createElement("div"); ring.className = "ring"; scene.appendChild(ring); }
  const t = scene.querySelector(sel);
  if (!t) { ring.classList.remove("on"); return; }
  const r = t.getBoundingClientRect(), s = scene.getBoundingClientRect();
  const p = pad == null ? 10 : pad;
  ring.style.left = (r.left - s.left - p) + "px";
  ring.style.top = (r.top - s.top - p) + "px";
  ring.style.width = (r.width + p * 2) + "px";
  ring.style.height = (r.height + p * 2) + "px";
  ring.style.borderRadius = (r.width === r.height ? "50%" : "18px");
  ring.classList.add("on");
}
function ringOff(scene){ const ring = scene.querySelector(".ring"); if (ring) ring.classList.remove("on"); }
async function typeInto(el, text, my){
  el.textContent = "";
  for (let i = 0; i < text.length; i++){ el.textContent += text[i]; await sleep(52, my); }
}

/* ================= the film ================= */
const SCENES = [

/* 1 · the problem */
async function(my){
  const sc = newScene("dark");
  const st = document.createElement("div"); st.className = "stage"; sc.appendChild(st);
  await line(st, "big", "Every patient has questions after surgery.", my);
  const l2 = await line(st, "med", "Not all of them are heard. Not enough of them are answered.", my);
  await sleep(900, my);
},

/* 2 · why they get lost */
async function(my){
  const sc = newScene("dark");
  const st = document.createElement("div"); st.className = "stage"; sc.appendChild(st);
  await line(st, "big", "Your questions come up spontaneously, not on a schedule.", my);
  await line(st, "med", "They get forgotten. They get lost.", my);
  await line(st, "med", "Some come from family and caregivers who are not there for the touch points with your care team, by phone, or face to face in the hospital or clinic.", my);
  await sleep(900, my);
},

/* 3 · why Heard exists, over a soft view of the app */
async function(my){
  const sc = newScene("cream");
  const bd = document.createElement("div"); bd.className = "backdrop";
  bd.innerHTML = phoneWrap(patientHead() + listCard(1, entry("Is it normal for my calf to feel tight?", "Today, 9:12 AM")));
  sc.appendChild(bd);
  const bw = bd.querySelector(".phonewrap"); bw.style.left = "50%"; bw.style.transform = "translateX(-50%) scale(" + Math.min(1, (innerHeight - 40) / 724) + ")";
  const veil = document.createElement("div"); veil.className = "veil"; sc.appendChild(veil);
  const st = document.createElement("div"); st.className = "stage"; sc.appendChild(st);
  await line(st, "big", "This is why Heard was developed.", my);
  await line(st, "med", "A simple way to collect your questions as they arise, using something as simple as your words, transcribed into text.", my);
  await line(st, "med", "Heard keeps your list for your provider team, stored in the cloud. Not a lost scrap of paper. Not a forgotten question.", my);
  await line(st, "med", "Stored, and ready for your care team, so that at those touch points your concerns are addressed.", my);
  await sleep(900, my);
},

/* 4 · the app itself, with the green ring on what is being described */
async function(my){
  const sc = newScene("cream");
  sc.insertAdjacentHTML("beforeend", phoneWrap(patientHead() + listCard(0)));
  fitPhone(sc);
  await sleep(500, my);

  let s1 = "Capturing a concern takes one tap.";
  say(sc, s1); ringTo(sc, "#mic", 8);
  await sleep(readTime(s1), my);

  /* tap on */
  const mic = sc.querySelector("#mic");
  mic.classList.add("rec");
  sc.querySelector("#miclabel").textContent = "Listening…";
  sc.querySelector("#dot").classList.add("live");
  sc.querySelector("#plabel").textContent = "Recording — you are in control";
  s1 = "Tap the button, and the microphone turns on and hears your question or concern.";
  say(sc, s1);
  const typing = typeInto(sc.querySelector("#live"), "Is it normal for my calf to feel tight?", my);
  await sleep(readTime(s1), my); await typing;

  /* tap off */
  mic.classList.remove("rec");
  sc.querySelector("#miclabel").textContent = "Tap to speak";
  sc.querySelector("#dot").classList.remove("live");
  sc.querySelector("#plabel").textContent = "Microphone off — nothing is being recorded";
  s1 = "Tap again, and the microphone shuts off.";
  say(sc, s1);
  await sleep(readTime(s1), my);

  ringOff(sc);
  s1 = "Only what you choose to capture is captured. That is completely within your control, and at your discretion.";
  say(sc, s1);
  await sleep(readTime(s1), my);

  /* the list accrues, and the team sees it */
  const lc = sc.querySelector("#listcard");
  lc.outerHTML = listCard(2,
    entry("Is it normal for my calf to feel tight?", "Today, 9:12 AM") +
    entry("When can I shower with the dressing on?", "Today, 4:40 PM"));
  sc.querySelector("#live").innerHTML = "&nbsp;";
  s1 = "The questions you accrue are visible to your care team before and during your touch points: phone calls, visits in the hospital, or in clinic.";
  say(sc, s1); ringTo(sc, "#listcard", 6);
  await sleep(readTime(s1), my);

  s1 = "So every question you have had along the way can be acknowledged and addressed.";
  say(sc, s1);
  await sleep(readTime(s1), my);
  ringOff(sc);
},

/* 5 · the partnership */
async function(my){
  const sc = newScene("cream");
  const st = document.createElement("div"); st.className = "stage"; sc.appendChild(st);
  await line(st, "big", "We want you to be heard.", my);
  await line(st, "med", "For all your questions and concerns, we strive to make this as simple and complete as possible.", my);
  await line(st, "med", "You and your care team are a partnership. This tool helps strengthen that collaboration.", my);
  const img = document.createElement("img");
  img.src = "heard-icon.png"; img.alt = "Heard"; img.className = "endmark";
  st.appendChild(img); on(img);
  await sleep(1400, my);
  const row = document.createElement("div"); row.className = "btnrow";
  row.innerHTML =
    '<button class="fbtn pri" onclick="show(0)">&#8635; Watch again</button>' +
    '<a class="fbtn sub" href="tour.html">See how to use it</a>' +
    '<a class="fbtn sub" href="./">Back to Heard</a>';
  st.appendChild(row); on(row);
}
];

async function show(i){
  token++; const my = token;
  clearTimeout(timer);
  idx = Math.max(0, Math.min(SCENES.length - 1, i));
  document.getElementById("prog").style.width = Math.round(((idx + 1) / SCENES.length) * 100) + "%";
  setPaused(false);
  try {
    await SCENES[idx](my); guard(my);
    if (idx < SCENES.length - 1) timer = setTimeout(() => show(idx + 1), 500);
  } catch (e) { if (e !== "x") console.error(e); }
}
function setPaused(p){
  paused = p;
  document.getElementById("pause").textContent = p ? "Play" : "Pause";
}
document.getElementById("pause").onclick = e => { e.stopPropagation(); setPaused(!paused); };
document.getElementById("restart").onclick = e => { e.stopPropagation(); show(0); };

/* Tap anywhere skips ahead one scene; the hint fades away on its own. */
film.addEventListener("click", () => {
  if (idx < SCENES.length - 1) show(idx + 1);
});
addEventListener("keydown", e => {
  if (e.key === "ArrowRight" && idx < SCENES.length - 1) show(idx + 1);
  if (e.key === "ArrowLeft" && idx > 0) show(idx - 1);
  if (e.key === " ") { e.preventDefault(); setPaused(!paused); }
});
setTimeout(() => { const h = document.getElementById("hint"); h.style.opacity = "0"; }, 9000);

/* A hidden tab freezes everything; pause there and resume on return. */
let pausedByTab = false;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { if (!paused){ pausedByTab = true; setPaused(true); } }
  else if (pausedByTab) { pausedByTab = false; setPaused(false); }
});

show(0);
</script>
</body>
</html>
